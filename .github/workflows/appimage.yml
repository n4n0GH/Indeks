#
# Builds Indeks as an AppImage when a release is published and attaches it to
# the release, together with its .zsync file. The AppImage carries where its
# releases are (see LDAI_UPDATE_INFORMATION in the build script), so
# AppImageUpdate, Gear Lever, AppImageLauncher and the like find a newer Indeks
# by themselves and fetch only what changed; the .zsync file is what they read
# for that, so both files belong to every release.
#
# Can also be started by hand from the Actions page. The files are then an
# artifact of the run.

name: AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # What Indeks is developed on: a Qt and KDE Frameworks that are new
      # enough, with Kirigami Addons and Qt PDF as packages. Its C library is
      # newer than most systems have; the AppImage brings it along for those
      # (add_own_glibc in the build script).
      image: opensuse/tumbleweed
    steps:
      - name: Install what Indeks is built and bundled with
        run: |
          zypper --non-interactive refresh
          # The image and the repository are not always of the same day. Where
          # the image is ahead, the packages to build with ask for older
          # libraries than it has, and nothing can be installed. This puts
          # what is in the image at what the repository has, older or newer.
          zypper --non-interactive dup --allow-downgrade --no-recommends
          zypper --non-interactive install --no-recommends \
            git tar gzip curl file binutils gawk findutils \
            cmake ninja gcc-c++ rsvg-convert desktop-file-utils \
            kf6-extra-cmake-modules \
            qt6-base-devel qt6-declarative-devel qt6-quickcontrols2-devel \
            qt6-sql-devel qt6-network-devel qt6-dbus-devel qt6-widgets-devel qt6-test-devel \
            qt6-pdf-devel qt6-pdfquick-devel \
            kf6-kirigami-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kconfig-devel kf6-kio-devel kf6-kcrash-devel \
            kf6-kdbusaddons-devel kf6-kiconthemes-devel \
            kf6-kfilemetadata-devel kf6-kwindowsystem-devel \
            kf6-kservice-devel kf6-kguiaddons-devel kf6-kmime-devel \
            kirigami-addons6-devel \
            kf6-kirigami-imports kirigami-addons6 kf6-qqc2-desktop-style \
            kf6-syntax-highlighting-imports qt6-pdf-imports \
            qt6-declarative-imports qt6-sql-sqlite libQt6Svg6 \
            qt6-imageformats qt6-wayland plasma6-integration-plugin \
            breeze6-style kio-extras kf6-kfilemetadata

      - uses: actions/checkout@v4

      - name: Build the AppImage
        run: packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: indeks-appimage
          path: |
            dist/Indeks-*.AppImage
            dist/Indeks-*.AppImage.zsync
          if-no-files-found: error

      - name: Attach the AppImage to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Indeks-*.AppImage
            dist/Indeks-*.AppImage.zsync
          fail_on_unmatched_files: true
